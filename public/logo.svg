<title id="logo-title">월계는 처음이라 — 열린 집 로고</title>
<desc id="logo-description">녹색 집과 웃는 이웃, 열린 베이지색 문과 길을 형상화한 로고와 월계는 처음이라 글자. 완전한 벡터 패스, 투명 배경.</desc>
