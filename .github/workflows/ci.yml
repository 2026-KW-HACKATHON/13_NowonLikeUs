name: CI

# dev · master 로 들어가는 PR 과 두 브랜치에 푸시될 때 돌린다.
# 브랜치 보호 규칙(master-protection)에서 이 잡을 필수 체크로 걸 수 있다.
on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# 같은 브랜치에 연달아 푸시하면 앞선 실행은 취소한다. 무료 실행 시간을 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 비밀값은 넣지 않는다. 할 일 API 는 전부 요청 시점에 DB 를 읽는 동적 라우트라
    # 빌드와 테스트에 실제 DB 연결이 필요 없다. 더미 값은 Prisma 클라이언트가
    # 생성될 때 형식만 맞추려는 것이다.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # Prisma 클라이언트가 없으면 타입 검사와 빌드가 먼저 깨진다.
      - name: Prisma 클라이언트 생성
        run: npx prisma generate

      - name: 린트
        run: npm run lint

      # `LayoutProps` 같은 전역 타입은 Next 가 빌드할 때 만들어 준다. tsc 가 빌드보다
      # 먼저 돌면 깨끗한 환경에서는 그 타입이 없어 실패하므로, 빌드 없이 타입만 먼저 생성한다.
      - name: Next 라우트 타입 생성
        run: npx next typegen

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 단위 테스트
        run: npm test

      - name: 빌드
        run: npm run build
